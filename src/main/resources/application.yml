server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/fantasydb
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update   # (or validate, if schema already exists)
    show-sql: true
    properties:
      hibernate.format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

ml:
  api:
    # 127.0.0.1, not localhost -- on this machine "localhost" resolves to the IPv6 loopback
    # (::1) first, but uvicorn's --host 0.0.0.0 only binds IPv4, so RestTemplate's calls got a
    # bare "Connection refused" even though curl (which preferred IPv4) reached the server fine.
    url: ${ML_API_URL:http://127.0.0.1:8000}

fantasypros:
  api:
    key: ${FANTASY_PROS_API:}

app:
  season:
    # The one place to roll these when a new NFL season starts -- see SeasonConfig javadoc.
    # target-season = season being projected; source-season = most recent completed season used
    # as model input. Override via SOURCE_SEASON / TARGET_SEASON env vars without a code change.
    source-season: ${SOURCE_SEASON:2025}
    target-season: ${TARGET_SEASON:2026}
  scheduler:
    # Turns off ALL @Scheduled jobs without a code change -- e.g. set false via an env var if you
    # don't want background jobs hitting Sleeper/the ML server.
    enabled: ${SCHEDULER_ENABLED:true}
    # Cron for LeagueSyncScheduler: Tuesday 7am by default, after Sun/Mon (and MNF) games have
    # posted final stats/standings. Spring cron format: second minute hour day-of-month month day-of-week.
    league-sync-cron: ${LEAGUE_SYNC_CRON:0 0 7 * * TUE}
    # Cron for WeeklyDataSyncScheduler (player stats/ranks resync + prediction refresh + CSV
    # export): Tuesday 6am, an hour ahead of the league sync -- no ordering dependency, just
    # keeps this heavier job (1-3 min of Sleeper+ESPN calls) out of that one's window.
    stats-sync-cron: ${STATS_SYNC_CRON:0 0 6 * * TUE}





