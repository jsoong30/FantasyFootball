server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/fantasydb
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update   # (or validate, if schema already exists)
    show-sql: true
    properties:
      hibernate.format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

ml:
  api:
    # 127.0.0.1, not localhost -- on this machine "localhost" resolves to the IPv6 loopback
    # (::1) first, but uvicorn's --host 0.0.0.0 only binds IPv4, so RestTemplate's calls got a
    # bare "Connection refused" even though curl (which preferred IPv4) reached the server fine.
    url: ${ML_API_URL:http://127.0.0.1:8000}

fantasypros:
  api:
    key: ${FANTASY_PROS_API:}

app:
  scheduler:
    # Turns off ALL @Scheduled jobs (currently just the weekly league auto-sync) without a code
    # change -- e.g. set false via an env var if you don't want background jobs hitting Sleeper.
    enabled: ${SCHEDULER_ENABLED:true}
    # Cron for LeagueSyncScheduler: Tuesday 7am by default, after Sun/Mon (and MNF) games have
    # posted final stats/standings. Spring cron format: second minute hour day-of-month month day-of-week.
    league-sync-cron: ${LEAGUE_SYNC_CRON:0 0 7 * * TUE}





